name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set version
        run: echo "APP_VERSION=$("${{ github.ref_name }}".TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Publish (x64)
        run: |
          dotnet publish WinMensa.csproj -c Release `
            /p:Platform=x64 `
            /p:PublishProfile=Properties\PublishProfiles\win-x64.pubxml

      - name: Download WinAppSDK runtime installer
        run: |
          New-Item -ItemType Directory -Force installer\redist | Out-Null
          Invoke-WebRequest `
            -Uri "https://aka.ms/windowsappsdk/1.8/latest/windowsappruntimeinstall-x64.exe" `
            -OutFile "installer\redist\WindowsAppRuntimeInstall-x64.exe"

      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer\WinMensa.iss
        env:
          APP_VERSION: ${{ env.APP_VERSION }}

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: installer\Output\*.exe
          generate_release_notes: true
